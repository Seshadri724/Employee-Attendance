name: CI/CD Pipeline

on:
  push:
    branches: [main, master, demo1]
  pull_request:
    branches: [main, master, demo1]

jobs:
  # Job 1: Test & Build Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Job 2: Test Backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install flask flask-cors scikit-learn numpy pytest

      - name: Run tests
        working-directory: ./backend
        run: |
          ls -R
          python -c "import chatbot_service; print('Successfully imported chatbot_service')"
          echo "Backend import test passed!"

  # Job 3: Deploy to Vercel (Frontend)
  deploy-frontend:
    name: Deploy Frontend
    needs: [test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/demo1'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # Job 4: Deploy Backend (Render auto-deploys from GitHub)
  deploy-backend:
    name: Deploy Backend
    needs: [test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/demo1'
    
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Render auto-deploys from GitHub when connected"
          echo "No manual trigger needed if Render is connected to repo"
          # Uncomment below if you have Render deploy hook:
          # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
